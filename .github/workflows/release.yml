name: release-apk
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="${GITHUB_REF_NAME}"
          gh release create "$T" "apk/monstertower-$T.apk" --repo "$GITHUB_REPOSITORY" --title "$T" --notes-file "apk/release_notes_$T.md"